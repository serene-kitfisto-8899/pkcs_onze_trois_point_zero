[package]
name = "sign-tx"
version = "0.1.0"
edition = "2024"
publish = ["artifact-keeper"]

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
cryptoki-sys = "0.5.0"
ed25519-dalek = "3.0.0"
hostname = "0.4.2"
libloading = "0.9.0"
p256 = { version = "0.14.0", features = ["ecdsa"] }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
uuid = { version = "1.25.0", features = ["v4"] }
